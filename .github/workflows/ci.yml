name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ecommerce
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-at-least-sixteen-chars
      PORT: 5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Migrations apply, roll back and re-apply
        run: |
          node dist/db/cli.js up
          node dist/db/cli.js down && node dist/db/cli.js down && node dist/db/cli.js down
          node dist/db/cli.js up
          node dist/db/cli.js seed
      - name: API boots and answers
        run: |
          node dist/server.js &
          for i in $(seq 1 30); do curl -sf localhost:5000/ready && break; sleep 1; done
          curl -sf localhost:5000/health
          curl -sf "localhost:5000/api/products?limit=1" | grep -q '"success":true'
          curl -sf -X POST localhost:5000/graphql -H 'Content-Type: application/json' -d '{"query":"{ categories { name } }"}' | grep -q Electronics
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-test/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker build -t ecommerce-api .
      - run: docker build -t ecommerce-web frontend-test
